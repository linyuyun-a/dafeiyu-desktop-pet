<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>DeepSeek Pet</title>
    <!-- Cubism Core 必须是经典脚本：easy-live2d 直接读全局 Live2DCubismCore -->
    <script src="pet://assets/core/live2dcubismcore.min.js"></script>
  </head>
  <body>
    <div id="stage"></div>

    <div id="panel" class="panel" hidden>
      <header>
        <span id="dot" class="dot"></span>
        <strong>大肥鱼 · M0 spike</strong>
        <span class="spacer"></span>
        <button id="btn-capture" title="保存一张 canvas PNG 到 _probe/">📷</button>
        <button id="btn-alpha" title="透明自检：采样四角 alpha">α</button>
        <button id="btn-quit" title="退出 (Ctrl+Shift+Q)">✕</button>
      </header>

      <div id="meta" class="meta">加载中…</div>
      <div id="stats" class="stats">—</div>

      <section>
        <label>表情（Expressions）</label>
        <div class="row">
          <select id="expr-select"></select>
          <button id="expr-random">随机</button>
          <button id="expr-default">默认</button>
        </div>
      </section>

      <section>
        <label>动作（Motions）</label>
        <div id="motions" class="motions"></div>
      </section>

      <section>
        <label>口型 ParamMouthOpenY <span id="mouth-val">0.00</span></label>
        <input id="mouth" type="range" min="0" max="1" step="0.01" value="0" />
      </section>

      <section>
        <label>命中区（点击模型）</label>
        <div id="hit" class="hit">点头部 / 身体试试</div>
      </section>

      <footer id="log"></footer>
    </div>

    <!-- M2：气泡（她说的）与输入框（你说的），只占窗口上方 ~120px -->
    <div id="bubble" class="bubble" hidden>
      <div id="bubble-text"></div>
      <div id="bubble-meta" class="bubble-meta" hidden></div>
    </div>
    <form id="chatbar" class="chatbar" hidden>
      <input id="chat-input" type="text" placeholder="跟她说点什么…（Enter 发送 / Esc 关）" autocomplete="off" spellcheck="false" />
      <button id="chat-send" type="submit" title="发送">↑</button>
    </form>

    <div id="hint" class="hint">双击她说话 · Ctrl+滚轮缩放 · 拖我移动</div>

    <!-- 右下角缩放把手：无边框窗口唯一能"抓"的地方 -->
    <div id="resize" title="拖动改变大小（双击复位）"></div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
