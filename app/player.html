<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>大肥鱼 · 唱片机</title>
    <link rel="stylesheet" href="./player.css" />
  </head>
  <body>
    <div id="card">
      <canvas id="viz" aria-hidden="true"></canvas>
      <div id="head" title="按住这里拖动">
        <div id="brand">大肥鱼 · 唱片机</div>
        <div id="headBtns">
          <button id="close" title="关掉（Esc）">✕</button>
        </div>
      </div>
      <div id="grip" title="拖这里改大小"></div>

      <div id="tabs">
        <button class="tab on" data-view="disc">唱片</button>
        <button class="tab" data-view="lists">歌单</button>
      </div>

      <div id="view-disc" class="view">
      <div id="discWrap">
        <div id="disc">
          <div id="grooves"></div>
          <img id="cover" alt="" />
          <div id="hole"></div>
        </div>
        <div id="tonearm"></div>
        <div id="bubbles"><i></i><i></i><i></i></div>
      </div>

      <div id="meta">
        <div id="name">还没放歌</div>
        <div id="artist">让她点一首，或者在自己的播放器里放</div>
      </div>

      <div id="morePanel" class="hidden">
        <div class="mp-title">这一首的画面</div>
        <div id="pvDots" class="dots" title="歌词配色"></div>
        <div class="mp-note">默认跟着歌的脾气自动挑，点一下会锁住这一首</div>
      </div>

      <div id="lyrics">
        <canvas id="pv" class="hidden"></canvas>
        <div id="lyricsText"><div class="line dim">（暂无歌词）</div></div>
      </div>

      <div id="spectrum"></div>

      <div id="prog">
        <span id="cur">00:00</span>
        <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="播放进度" />
        <span id="tot">00:00</span>
      </div>

      <div id="controls">
        <button id="mode" class="mode-loop" title="列表循环"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a4 4 0 0 1 4-4h9M19 13a4 4 0 0 1-4 4H6M15 4l3 3-3 3M9 20l-3-3 3-3"/></svg></button>
        <button id="prev" title="上一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.5 5.6v12.8c0 .8-.9 1.3-1.6.9l-8.9-5.5a1 1 0 0 1 0-1.7l8.9-5.5c.7-.4 1.6.1 1.6.9z"/><rect x="5.2" y="5" width="2.1" height="14" rx="1"/></svg></button>
        <button id="play" title="播放 / 暂停"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.6 4.9v14.2c0 .9 1 1.4 1.7 1l11-7.1c.7-.4.7-1.5 0-1.9l-11-7.1c-.7-.5-1.7 0-1.7 1z"/></svg></button>
        <button id="next" title="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M5.5 5.6v12.8c0 .8.9 1.3 1.6.9l8.9-5.5a1 1 0 0 0 0-1.7L7.1 4.7c-.7-.4-1.6.1-1.6.9z"/><rect x="16.7" y="5" width="2.1" height="14" rx="1"/></svg></button>
        <button id="roam" title="漫游：按设置里的源自动续播"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12c0-2 1.4-3.4 3.2-3.4 2.6 0 4.2 6.8 6.6 6.8 1.8 0 3.2-1.4 3.2-3.4s-1.4-3.4-3.2-3.4c-2.4 0-4 6.8-6.6 6.8C8.4 15.4 7 14 7 12z"/></svg></button>
        <button id="more" title="形象与配色"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18.5" cy="12" r="1.7"/></svg></button>

        <div id="volWrap">
          <button id="mute" title="静音"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9.5h3.2L12 5.4v13.2L7.2 14.5H4z"/><path id="waveA" d="M15.2 9.1a4 4 0 0 1 0 5.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path id="waveB" d="M17.6 6.9a7.4 7.4 0 0 1 0 10.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <div id="volPop"><span id="volTip">80%</span><input id="vol" type="range" min="0" max="100" value="80" aria-label="音量" /></div>
        </div>
      </div>

      <div id="hint">她挑的歌会用这块小唱片放出来 · Esc 收起</div>
      </div><!-- /view-disc -->

      <div id="view-lists" class="view hidden">
        <div id="plBar">
          <span id="plWho">我的歌单</span>
          <button id="plRefresh" title="重新拉取">刷新</button>
        </div>
        <div id="plBody">
          <div id="plCol"></div>
          <div id="plMain"><div class="pl-empty">选左边一个歌单</div></div>
        </div>
      </div>
    </div>
    <audio id="audio" crossorigin="anonymous"></audio>
    <script src="./jizura-engine.js"></script>
    <!-- fifi-video (MIT) 运行时：classic script，顺序不能改 -->
    <script src="./fx/vendor/fifi/lib.js"></script>
    <script src="./fx/vendor/fifi/timeline.js"></script>
    <script src="./fx/vendor/fifi/xk.js"></script>
    <script src="./fx/vendor/fifi/xm-core.js"></script>
    <script src="./fx/vendor/fifi/xm-ds.js"></script>
    <script src="./fx/vendor/fifi/xm-doodle.js"></script>
    <script src="./fx/vendor/fifi/xm-tex.js"></script>
    <script src="./player.js"></script>
  </body>
</html>
